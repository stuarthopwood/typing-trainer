[package]
name = "neuralkeys-hid"
version = "0.2.0"
edition = "2021"
description = "Companion service for NeuralKeys — reads Hall Effect analog data from Keychron K2 HE via raw HID and exposes it over WebSocket"
license = "MIT"

[dependencies]
hidapi = "2.6"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
named-lock = "0.4"
