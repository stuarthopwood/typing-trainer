name: Companion Release

on:
  push:
    tags:
      - 'companion-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion/neuralkeys-hid

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Run tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuralkeys-hid-${{ matrix.target }}
          path: companion/neuralkeys-hid/target/${{ matrix.target }}/release/neuralkeys-hid${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/neuralkeys-hid-x86_64-pc-windows-msvc/neuralkeys-hid.exe
            artifacts/neuralkeys-hid-x86_64-apple-darwin/neuralkeys-hid
            artifacts/neuralkeys-hid-aarch64-apple-darwin/neuralkeys-hid
            artifacts/neuralkeys-hid-x86_64-unknown-linux-gnu/neuralkeys-hid
          generate_release_notes: true
